<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Kirubel, full-stack developer">
  <title>Kirubel, full-stack developer</title>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1f2328" opacity="0.10"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F38020" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#F38020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F38020"/>
      <stop offset="50%" stop-color="#FBAD41"/>
      <stop offset="100%" stop-color="#F38020"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F38020"/>
      <stop offset="45%" stop-color="#F38020"/>
      <stop offset="50%" stop-color="#FFE2B8"/>
      <stop offset="55%" stop-color="#F38020"/>
      <stop offset="100%" stop-color="#F38020"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0" dur="3.5s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="1" width="998" height="258" rx="14"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
      .label { font-size: 13px; font-weight: 600; letter-spacing: 4px; fill: #bc4c00; }
      .name { font-size: 64px; font-weight: 700; letter-spacing: -1.5px; fill: #1f2328; }
      .p { font-size: 22px; fill: #59636e; }

      .p { opacity: 0; animation: cycle 15s ease-in-out infinite; }
      @keyframes cycle {
        0% { opacity: 0; transform: translateY(10px); }
        3.00% { opacity: 1; transform: translateY(0); }
        17.00% { opacity: 1; transform: translateY(0); }
        20.00% { opacity: 0; transform: translateY(-10px); }
        100% { opacity: 0; transform: translateY(-10px); }
      }
      .p0 { animation-delay: 0s; }
      .p1 { animation-delay: 3s; }
      .p2 { animation-delay: 6s; }
      .p3 { animation-delay: 9s; }
      .p4 { animation-delay: 12s; }

      .fade-in { animation: rise 1s ease-out both; }
      .fade-in.d1 { animation-delay: .15s; }
      .fade-in.d2 { animation-delay: .3s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .p, .fade-in { animation: none; }
        .p0 { opacity: 1; }
      }

    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1000" height="260" fill="#ffffff"/>
    <rect width="1000" height="260" fill="url(#dots)"/>
    <ellipse cx="500" cy="130" rx="380" ry="160" fill="url(#glow)">
      <animate attributeName="cx" values="380;620;380" dur="14s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect x="1" y="1" width="998" height="258" rx="14" fill="none" stroke="#d0d7de"/>

  <text class="label fade-in" x="500" y="70" text-anchor="middle">FULL-STACK DEVELOPER</text>
  <text class="name fade-in d1" x="500" y="136" text-anchor="middle">Kirubel</text>
  <rect class="fade-in d2" x="460" y="152" width="80" height="3" rx="1.5" fill="url(#shine)"/>
  <g>
    <text class="p p0" x="500" y="198" text-anchor="middle">E-commerce platforms and marketplaces</text>
    <text class="p p1" x="500" y="198" text-anchor="middle">Online learning systems</text>
    <text class="p p2" x="500" y="198" text-anchor="middle">Telegram bots and integrations</text>
    <text class="p p3" x="500" y="198" text-anchor="middle">Live chat and real-time features</text>
    <text class="p p4" x="500" y="198" text-anchor="middle">Payload CMS on Cloudflare Workers</text>
  </g>
</svg>
