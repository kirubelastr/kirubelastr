<svg xmlns="http://www.w3.org/2000/svg" width="560" height="100" viewBox="0 0 560 100" role="img" aria-label="Hi, I'm Kirubel. I build online stores, course platforms, Telegram bots and live chat.">
  <title>Hi, I'm Kirubel. I build online stores, course platforms, Telegram bots and live chat.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .name { font-size: 32px; font-weight: 600; fill: #f0f6fc; }
    .p { font-size: 18px; fill: #4493f8; opacity: 0; animation: swap 12s ease-in-out infinite; }
    @keyframes swap {
      0% { opacity: 0; transform: translateY(6px); }
      3.00% { opacity: 1; transform: translateY(0); }
      22.00% { opacity: 1; transform: translateY(0); }
      25.00% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }
    .p0 { animation-delay: 0s; }
    .p1 { animation-delay: 3s; }
    .p2 { animation-delay: 6s; }
    .p3 { animation-delay: 9s; }
    @media (prefers-reduced-motion: reduce) {
      .p { animation: none; }
      .p0 { opacity: 1; }
    }
  </style>
  <text class="name" x="0" y="40">Hi, I'm Kirubel</text>
  <text class="p p0" x="0" y="82">I build online stores and marketplaces</text>
  <text class="p p1" x="0" y="82">I build online course platforms</text>
  <text class="p p2" x="0" y="82">I build Telegram bots and integrations</text>
  <text class="p p3" x="0" y="82">I build live chat for web apps</text>
</svg>
